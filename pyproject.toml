[project]
name = "ohm"
version = "0.1.1"
description = "Enterprise-grade orchestrator and harness for LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.12",
    "mcp[cli]>=1.28.1",
    "pydantic-ai>=2.18.0",
    "pydantic-evals>=2.18.0",
    "pydantic-graph>=2.18.0",
    "strands-agents>=1.50.1",
    "strands-agents-tools>=0.8.5",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ohm = "ohm.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
